name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor product images into the site
        run: bash scripts/fetch-images.sh
      - name: Build with absolute URLs for feeds and OG tags
        run: |
          OWNER="${{ github.repository_owner }}"
          BASE_URL="https://${OWNER,,}.github.io/${{ github.event.repository.name }}" python3 build.py
      - name: Package site
        run: |
          mkdir _site
          cp -r index.html shop.html products assets images products.json feed.xml feed.csv sitemap.xml .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
